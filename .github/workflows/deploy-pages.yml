# Deploy MailSure static site (public/) to GitHub Pages.
# Publishes only public/ as the site root — never the repo root / README.
# Requires Settings → Pages → Source: GitHub Actions (do not use "Deploy from a branch").
name: Deploy MailSure Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify public/ site root
        run: |
          set -euo pipefail
          test -f public/index.html
          test -d public/css
          test -d public/js
          # Ensure we never upload the repository root (would Jekyll-render README).
          test ! -f public/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
