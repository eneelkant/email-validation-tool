name: Refresh disposable domains

# Optional fail-safe refresh of the vendored disposable blocklist.
# Does not run on every validation request. On failure the existing file stays.

on:
  schedule:
    # Weekly Monday 06:15 UTC
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh disposable dataset (fail-safe replace)
        id: refresh
        run: |
          set -euo pipefail
          # Point at repo data files explicitly (not runtime tmp).
          export OPENVERIFY_DISPOSABLE_PATH="$GITHUB_WORKSPACE/data/disposable-domains.txt"
          export OPENVERIFY_FREE_PROVIDERS_PATH="$GITHUB_WORKSPACE/data/free-email-providers.txt"
          if npm run update:disposable; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Disposable refresh failed; leaving existing dataset unchanged."
            exit 1
          fi

      - name: Create pull request if changed
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh disposable domain dataset'
          title: 'chore: refresh disposable domain dataset'
          body: |
            Automated refresh of `data/disposable-domains.txt` from
            [disposable-email-domains/disposable-email-domains](https://github.com/disposable-email-domains/disposable-email-domains)
            (`disposable_email_blocklist.conf`, CC0).

            - Fail-safe: refresh aborts without changing the file if download/parse/size checks fail.
            - Free email providers from `data/free-email-providers.txt` are excluded and never marked disposable.
            - No per-request download; runtime uses the vendored snapshot only.
          branch: chore/refresh-disposable-domains
          delete-branch: true
          add-paths: |
            data/disposable-domains.txt
